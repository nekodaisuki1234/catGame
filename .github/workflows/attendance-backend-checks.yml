name: Attendance backend checks
on:
  push:
    branches: [main, codex/paper-batch9]
    paths: ['backend/**', 'Makefile', '.github/workflows/attendance-backend-checks.yml', 'day-designs/paper-core.js', 'day-designs/paper-holidays.js']
  pull_request:
    paths: ['backend/**', 'Makefile', '.github/workflows/attendance-backend-checks.yml', 'day-designs/paper-core.js', 'day-designs/paper-holidays.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: |
          npm install --prefix backend --ignore-scripts --save-exact @aws-sdk/client-dynamodb@latest @aws-sdk/client-s3@latest @aws-sdk/lib-dynamodb@latest @aws-sdk/s3-request-presigner@latest
      - name: Inspect dependency advisories
        run: |
          npm audit --prefix backend --json > /tmp/attendance-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/attendance-audit.json', 'utf8'));
          console.log('BACKEND_PACKAGE_JSON:' + fs.readFileSync('backend/package.json', 'utf8').replace(/\n/g, ''));
          console.log('BACKEND_AUDIT:' + JSON.stringify({error:audit.error,metadata:audit.metadata,vulnerabilities:Object.fromEntries(Object.entries(audit.vulnerabilities||{}).map(([name,v])=>[name,{severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via}]))}));
          NODE
      - name: Export dependency lock for bootstrap
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('backend/package-lock.json').toString('base64');
          const chunks = encoded.match(/.{1,3500}/g);
          chunks.forEach((chunk, i) => console.log(`BACKEND_LOCK_CHUNK ${i+1}/${chunks.length}:${chunk}`));
          NODE
      - name: Backend tests
        run: npm test --prefix backend
      - uses: aws-actions/setup-sam@v2
      - name: Validate AWS template
        run: sam validate --lint --template-file backend/infra/template.yaml --region ap-northeast-1
      - name: Verify Lambda packaging
        run: sam build --template-file backend/infra/template.yaml
