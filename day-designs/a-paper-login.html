<!doctype html>
<html lang="ja" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3f1">
<meta name="description" content="SET勤怠のログイン画面プレビュー。A. PaperのデザインでMicrosoft 365ログインの入口を確認できます。">
<title>ログイン｜SET 勤怠</title>
<link rel="stylesheet" href="./studies.css?v=ac-punch1">
<link rel="stylesheet" href="./paper.css?v=paper-login29">
<link rel="stylesheet" href="./paper-login.css?v=paper-login29">
<script src="./paper-login.js?v=paper-login29" defer></script>
</head>
<body class="login-page">
<div class="login-sheet">
 <header class="login-masthead">
  <div class="login-brand"><span class="wordmark">SET</span><span class="login-brand-caption">勤怠管理</span></div>
  <span class="login-preview-badge">プレビュー</span>
 </header>
 <main class="login-main" aria-labelledby="loginTitle">
  <div class="login-illustration" aria-hidden="true">
   <div class="login-orbit"></div>
   <div class="login-time-card">
    <div class="login-card-top"><span>DAILY NOTE</span><span class="login-card-check"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 10 3 3 7-7"/></svg></span></div>
    <span class="login-card-time">09<span>:</span>00</span>
    <div class="login-card-bottom"><span class="login-card-dot"></span><span>一日のはじまり</span><span class="login-card-rule"></span></div>
   </div>
   <span class="login-bookmark"></span>
  </div>
  <div class="login-intro">
   <p class="login-eyebrow">SET ATTENDANCE</p>
   <h1 id="loginTitle">今日の仕事を、<br><span>すっきり。</span></h1>
   <p class="login-description">打刻も、実績も、休暇も。<br>いつものアカウントで、ひとつに。</p>
  </div>
  <div class="login-actions">
   <button type="button" id="microsoftLogin" class="login-microsoft" aria-describedby="loginPreview">
    <span class="login-microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span>Microsoft 365でログイン</span>
    <svg class="login-button-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
   </button>
   <a id="loginDemo" class="login-demo" href="./a-paper.html?screen=1&amp;v=paper-login29">デモを開く<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
   <p id="loginPreview" class="login-preview-note">ログイン画面のプレビューです。<br>Microsoft 365との認証は未接続です。</p>
  </div>
 </main>
 <footer class="login-footer"><span class="login-footer-rule"></span><span>A little order, every day.</span><span class="login-footer-rule"></span></footer>
</div>
<div id="loginToast" class="login-toast" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><p class="login-noscript">ログインの案内を表示するにはJavaScriptを有効にしてください。デモへのリンクはそのまま利用できます。</p></noscript>
</body>
</html>
