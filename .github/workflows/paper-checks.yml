name: Paper attendance checks

on:
  push:
    branches: [main, 'codex/paper-batch9']
    paths:
      - 'day-designs/paper-*.js'
      - 'day-designs/paper*.css'
      - 'day-designs/paper.webmanifest'
      - 'day-designs/paper-icon*'
      - 'day-designs/a-paper*.html'
      - 'tests/paper-*.cjs'
      - '.github/workflows/paper-checks.yml'
      - '.github/workflows/paper-holidays-yearly.yml'
      - 'scripts/update-paper-holidays.cjs'
  pull_request:
    paths:
      - 'day-designs/paper-*.js'
      - 'day-designs/paper*.css'
      - 'day-designs/paper.webmanifest'
      - 'day-designs/paper-icon*'
      - 'day-designs/a-paper*.html'
      - 'tests/paper-*.cjs'
      - '.github/workflows/paper-checks.yml'
      - '.github/workflows/paper-holidays-yearly.yml'
      - 'scripts/update-paper-holidays.cjs'

permissions:
  contents: read

jobs:
  attendance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model and submission checks
        run: |
          node tests/paper-push-check.cjs
          node tests/paper-holiday-update-check.cjs
          node tests/paper-attendance-check.cjs
          node tests/paper-submission-check.cjs
          node tests/paper-batch-check.cjs
          node tests/paper-planning-check.cjs
          node tests/paper-initialization-check.cjs
          node tests/paper-repository-check.cjs
          node tests/paper-absence-check.cjs
          node tests/paper-projects-check.cjs
          node tests/paper-phases-check.cjs
          node tests/paper-leave-request-check.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/paper-browser" --no-save --no-package-lock --ignore-scripts playwright@1.57.0
          node "$RUNNER_TEMP/paper-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser regressions and responsive checks
        run: |
          export PAPER_PLAYWRIGHT_MODULE="$RUNNER_TEMP/paper-browser/node_modules/playwright"
          export PAPER_SCREENSHOT_DIR="$RUNNER_TEMP/paper-screenshots"
          node tests/paper-push-ui-check.cjs
          node tests/paper-login-ui-check.cjs
          node tests/paper-leave-parity-ui-check.cjs
          node tests/paper-leave-request-ui-check.cjs
          node tests/paper-defaults-ui-check.cjs
          node tests/paper-tabs-ui-check.cjs
          node tests/paper-phases-ui-check.cjs
          node tests/paper-ui-check.cjs
          node tests/paper-holidays-ui-check.cjs
          node tests/paper-submission-ui-check.cjs
          node tests/paper-batch-ui-check.cjs
          node tests/paper-planning-ui-check.cjs
          node tests/paper-preparation-ui-check.cjs
          node tests/paper-polish-ui-check.cjs
          node tests/paper-absence-ui-check.cjs
          node tests/paper-rest-ui-check.cjs
          node tests/paper-settings-ui-check.cjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-browser-screenshots
          path: ${{ runner.temp }}/paper-screenshots
          if-no-files-found: ignore
          retention-days: 7
