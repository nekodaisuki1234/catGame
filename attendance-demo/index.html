<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>day. — 動く勤怠モック</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef3fb;color:#18304f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #80a6ff;outline-offset:4px}.app{max-width:460px;margin:auto;padding:24px 24px 20px;background:#fff;border-radius:26px;box-shadow:0 20px 70px #1934510b}header,.heading,.readout,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:28px;font-weight:750;letter-spacing:-1.4px}.brand i{font-style:normal;color:#3976f3}.tag{font-size:11px;padding:7px 10px;background:#f2f6fd;border-radius:20px;color:#8393aa}.heading{margin-top:22px;align-items:flex-end}h1{font-size:23px;letter-spacing:-.5px;margin:0;font-weight:650}.status{font-size:12px;color:#3b75ed;white-space:nowrap}.status.break{color:#9a86ce}.status.done{color:#627da1}.readout{margin-top:15px}.clock{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}.worked{font-size:11px;color:#8a98ac}.worked strong{display:block;margin-top:3px;color:#243e60;font-size:14px;font-weight:550;font-variant-numeric:tabular-nums}.scene{width:calc(100% + 24px);margin:0 -12px;height:auto;display:block}.scene text{font:12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2d476d}.scene .sub{font-size:10px;fill:#8f9fb5}.message{margin:-3px 0 15px;min-height:18px;font-size:11px;line-height:1.7;color:#8595ac}.primary{flex:1;border:0;min-height:48px;border-radius:15px;background:#1a3457;color:white;font-size:14px;font-weight:550}.reset{min-height:48px;padding:0 14px;border:1px solid #e3eaf4;border-radius:15px;background:white;color:#70839f;font-size:12px}.scrub{margin-top:17px}label{font-size:11px;color:#8797af}input[type=range]{width:100%;margin:8px 0 0;height:18px;accent-color:#3f79ee;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:10px;color:#9aa8ba}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.stage{padding:8px 2px;border:1px solid #e6edf7;border-radius:11px;background:#fafcff;color:#7c8fa9;font-size:10px;line-height:1.6;min-height:48px}.stage b{display:block;color:#2e476c;font-weight:550;font-size:11px}.stage.active{background:#ecf3ff;border-color:#bed3ff;color:#3b6cd0}.note{font-size:10px;line-height:1.8;color:#93a0b3;margin:15px 0 0}@media(max-width:360px){body{padding:8px}.app{padding:20px 18px}h1{font-size:21px}.clock{font-size:25px}.worked strong{font-size:12px}}
</style>
</head>
<body>
<main class="app">
<header><span class="brand">day<i>.</i></span><span class="tag">動きのサンプル</span></header>
<div class="heading"><h1>今日のリズム</h1><span id="status" class="status" aria-live="polite">● 勤務中</span></div>
<div class="readout"><span id="clock" class="clock">09:00</span><span class="worked">実働<strong id="worked">0時間00分</strong></span></div>
<svg class="scene" viewBox="0 0 420 438" role="img" aria-label="人が道を進み、休憩では止まるアニメーション">
<defs>
<path id="road" pathLength="100" d="M78 98C180 60 365 88 344 164C329 216 104 197 87 267C69 337 266 326 352 369" fill="none"/>
<linearGradient id="blue"><stop stop-color="#3a73ed"/><stop offset="1" stop-color="#82aaff"/></linearGradient>
</defs>
<ellipse cx="225" cy="240" rx="171" ry="138" fill="#f4f8ff"/>
<ellipse cx="223" cy="355" rx="156" ry="34" fill="#edf3fc"/>
<g transform="translate(52 22)">
<path d="M0 8L20 0L38 10V57L19 65L0 54Z" fill="#dce8fc"/>
<path d="M0 8L19 18V65L0 54Z" fill="#a6c1eb"/>
<path d="M5 20L12 23M5 30L12 33M5 40L12 43M25 24L32 21M25 34L32 31M25 44L32 41" stroke="white" stroke-width="3"/>
</g>
<g transform="translate(376 130)"><ellipse cy="25" rx="10" ry="4" fill="#e1ebfa"/><path d="M0-3V24" stroke="#89a8d1" stroke-width="2"/><ellipse cy="-7" rx="8" ry="18" fill="#b9cfea"/></g>
<use href="#road" transform="translate(0 12)" stroke="#e0e9fa" stroke-width="53" stroke-linecap="round"/>
<use href="#road" transform="translate(0 7)" stroke="#254b85" stroke-width="48" stroke-linecap="round"/>
<use href="#road" stroke="url(#blue)" stroke-width="48" stroke-linecap="round"/>
<use href="#road" stroke="#203c61" stroke-width="48" stroke-linecap="round" stroke-dasharray="46.1538 100"/>
<use href="#road" stroke="#beb1f0" stroke-width="48" stroke-dasharray="0 44 4.3 100"/>
<use href="#road" id="trail" stroke="#dfeaff" opacity=".6" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 100"/>
<circle cx="78" cy="98" r="5" fill="white" stroke="#abc1e5" stroke-width="2"/>
<g id="coffee">
<circle id="restHalo" r="20" fill="#ddd1fb" opacity=".3"/>
<path d="M2-35H15V-26Q15-18 8-18Q2-18 2-26Z" fill="#fbfcff" stroke="#ab99d9" stroke-width="1.5"/>
<path d="M15-32H19Q24-27 15-24" fill="none" stroke="#ab99d9" stroke-width="1.5"/>
<path d="M5-42Q1-47 6-51M12-42Q8-47 13-51" fill="none" stroke="#c2b3e7" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g transform="translate(352 369)">
<circle r="17" fill="#d5e4ff" opacity=".65"/><circle r="8" fill="#3e7df3" stroke="white" stroke-width="3"/>
<path d="M0-15V-52L19-46L0-38" fill="#9dbaff" stroke="#789bde" stroke-width="1.4"/>
<g id="check" opacity="0"><circle cy="-73" r="13" fill="#edf3ff"/><path d="M-6-73L-1-68L7-78" fill="none" stroke="#477cde" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<text x="22" y="80">09:00</text><text x="22" y="95" class="sub">出勤</text>
<g id="restLabel"><text>12:00 → 13:00</text><text y="15" class="sub">休憩・再開</text></g>
<text x="283" y="420">16:30</text><text x="328" y="420" class="sub">退勤</text>
<g id="person">
<ellipse cy="3" rx="13" ry="4.5" fill="#163151" opacity=".16"/>
<g id="body">
<g id="legA"><path d="M-3-18L-7-7L-8 1" fill="none" stroke="#1d385c" stroke-width="6" stroke-linecap="round"/><path d="M-10 1H-3" stroke="white" stroke-width="3.5" stroke-linecap="round"/></g>
<g id="legB"><path d="M3-18L7-7L6 1" fill="none" stroke="#3c5b82" stroke-width="6" stroke-linecap="round"/><path d="M4 1H11" stroke="white" stroke-width="3.5" stroke-linecap="round"/></g>
<path d="M-8-43Q0-48 7-42L9-19Q0-15-8-20Z" fill="#5889f0"/>
<path d="M-9-42Q-17-40-13-27L-8-26Z" fill="#1a395f"/>
<path d="M0-49V-42" stroke="#edc7b1" stroke-width="6"/>
<circle cy="-54" r="8" fill="#f0ccb6"/>
<path d="M-8-54Q-10-64-1-64Q7-64 9-58L3-57Q-3-58-5-51Z" fill="#19334f"/>
<g id="arm"><path d="M-4-40L-6-30L0-25" fill="none" stroke="#85adfb" stroke-width="5.5" stroke-linecap="round"/><circle cx="1" cy="-24" r="2.7" fill="#f0cbb5"/></g>
</g>
<g id="zzz" opacity="0"><text x="13" y="-71" style="fill:#9b87ca">z</text><text x="24" y="-82" style="fill:#9b87ca">z</text></g>
</g>
</svg>
<p id="message" class="message">今日の時間が、少しずつ道になります。</p>
<div class="controls"><button id="play" class="primary" type="button" aria-pressed="true">一時停止</button><button id="reset" class="reset" type="button">最初から</button></div>
<div class="scrub"><label for="scrubber">一日の流れ</label><input id="scrubber" type="range" min="0" max="450" step="1" value="0"><div class="times"><span>09:00</span><span>16:30</span></div></div>
<div class="stages" aria-label="場面を選ぶ">
<button class="stage" type="button" data-minute="0"><b>09:00</b>出勤</button>
<button class="stage" type="button" data-minute="180"><b>12:00</b>休憩</button>
<button class="stage" type="button" data-minute="240"><b>13:00</b>再開</button>
<button class="stage" type="button" data-minute="450"><b>16:30</b>退勤</button>
</div>
<p class="note">サンプルの一日を30秒に短縮して再生します。<br>場面のボタンやスライダーからも動きを確認できます。</p>
</main>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id),road=$("road"),length=road.getTotalLength();
const person=$("person"),body=$("body"),play=$("play"),slider=$("scrubber");
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
const stages=[...document.querySelectorAll("[data-minute]")];
let elapsed=0,running=false,frameId=0,lastTime=0,lastPhase="";
function stateAt(seconds){
  const minutes=Math.max(0,Math.min(450,seconds*15));
  const work=Math.min(minutes,180)+Math.max(0,minutes-240);
  return {minutes,work,p:work/390,phase:minutes>=450?"done":minutes>=180&&minutes<240?"break":"work"};
}
const point=p=>road.getPointAtLength(length*Math.max(0,Math.min(1,p)));
const rest=point(180/390);
$("coffee").setAttribute("transform","translate("+rest.x+","+rest.y+")");
$("restLabel").setAttribute("transform","translate("+Math.min(292,rest.x+32)+","+Math.max(170,rest.y-28)+")");
function render(stamp){
  const data=stateAt(elapsed),pos=point(data.p),next=point(data.p+.004);
  const walking=running&&data.phase==="work"&&!reduced.matches;
  const angle=walking?Math.sin(stamp/105)*24:0;
  person.setAttribute("transform","translate("+pos.x+","+pos.y+")");
  body.setAttribute("transform","translate(0,"+(walking?-Math.abs(Math.sin(stamp/105))*1.5:0)+") scale("+(next.x<pos.x?-1:1)+",1)");
  $("legA").setAttribute("transform","rotate("+angle+" 0 -18)");
  $("legB").setAttribute("transform","rotate("+(-angle)+" 0 -18)");
  $("arm").setAttribute("transform","rotate("+(-angle*.7)+" 0 -40)");
  $("trail").style.strokeDasharray=(data.p*100)+" 100";
  $("restHalo").setAttribute("opacity",data.phase==="break"?"1":".3");
  $("zzz").setAttribute("opacity",data.phase==="break"?"1":"0");
  $("check").setAttribute("opacity",data.phase==="done"?"1":"0");
  const minute=Math.floor(540+data.minutes+1e-7),worked=Math.floor(data.work+1e-7);
  $("clock").textContent=String(Math.floor(minute/60)).padStart(2,"0")+":"+String(minute%60).padStart(2,"0");
  $("worked").textContent=Math.floor(worked/60)+"時間"+String(worked%60).padStart(2,"0")+"分";
  slider.value=Math.round(data.minutes);
  slider.setAttribute("aria-valuetext",$("clock").textContent+"、実働"+$("worked").textContent);
  if(lastPhase!==data.phase){
    lastPhase=data.phase;
    $("status").className="status "+data.phase;
    $("status").textContent="● "+(data.phase==="break"?"休憩中":data.phase==="done"?"退勤しました":"勤務中");
    $("message").textContent=data.phase==="break"?"ここでひと休み。再開すると、また歩きます。":data.phase==="done"?"今日の記録ができました。おつかれさまでした。":"今日の時間が、少しずつ道になります。";
  }
  const active=data.minutes>=450?450:data.minutes>=240?240:data.minutes>=180?180:0;
  stages.forEach(button=>button.classList.toggle("active",Number(button.dataset.minute)===active));
  play.textContent=running?"一時停止":data.phase==="done"?"もう一度再生":"再生する";
  play.setAttribute("aria-pressed",String(running));
}
function tick(stamp){
  if(!running)return;
  if(lastTime)elapsed=Math.min(30,elapsed+Math.min(.12,(stamp-lastTime)/1000));
  lastTime=stamp;
  if(elapsed>=30)running=false;
  render(stamp);
  if(running)frameId=requestAnimationFrame(tick);
}
function pause(){
  running=false;lastTime=0;cancelAnimationFrame(frameId);render(performance.now());
}
function start(){
  cancelAnimationFrame(frameId);
  if(elapsed>=30)elapsed=0;
  running=true;lastTime=0;render(performance.now());frameId=requestAnimationFrame(tick);
}
function seek(minutes){
  pause();elapsed=minutes/15;render(performance.now());
}
play.addEventListener("click",()=>running?pause():start());
$("reset").addEventListener("click",()=>{pause();elapsed=0;start();});
slider.addEventListener("input",()=>seek(Number(slider.value)));
stages.forEach(button=>button.addEventListener("click",()=>seek(Number(button.dataset.minute))));
document.addEventListener("visibilitychange",()=>{lastTime=0;});
if(reduced.addEventListener)reduced.addEventListener("change",()=>{if(reduced.matches)pause();});
render(performance.now());
if(!reduced.matches)start();
})();
</script>
</body>
</html>
