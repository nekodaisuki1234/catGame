AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: A. Paper attendance API foundation (deploy only after tenant and template configuration)

Parameters:
  Stage:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
  EntraTenantId:
    Type: String
    Description: Microsoft Entra tenant ID; tenant-specific tokens only
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  EntraApiAudience:
    Type: String
    MinLength: 1
    Description: Audience of access tokens issued for this attendance API
  EntraRequiredScope:
    Type: String
    Default: access_as_user
    MinLength: 1
    AllowedPattern: '^[A-Za-z0-9_.:/-]+$'
    Description: Delegated API permission required on every route
  AllowedOrigin:
    Type: String
    Default: https://nekodaisuki1234.github.io
    AllowedPattern: '^https://[^/]+$'
    Description: Exact browser origin without a path or trailing slash
  TemplateKey:
    Type: String
    Default: ''
    AllowedPattern: '^(templates/[A-Za-z0-9][A-Za-z0-9._/-]{0,200})?$'
    Description: Approved xlsx template key in the private bucket; blank disables export
  TemplateMappingKey:
    Type: String
    Default: ''
    AllowedPattern: '^(templates/[A-Za-z0-9][A-Za-z0-9._/-]{0,200})?$'
    Description: Mapping envelope key in the private bucket; blank disables export

Resources:
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: paper-attendance
        - Key: Stage
          Value: !Ref Stage

  AttendanceFiles:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: paper-attendance
        - Key: Stage
          Value: !Ref Stage

  AttendanceFilesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AttendanceFiles
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AttendanceFiles.Arn
              - !Sub '${AttendanceFiles.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  AttendanceLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}/attendance'
      RetentionInDays: 30

  AttendanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttendanceStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EmployeeRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt AttendanceTable.Arn
              - Sid: ReadApprovedTemplates
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${AttendanceFiles.Arn}/templates/*'
              - Sid: PrivateExports
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${AttendanceFiles.Arn}/outputs/*'
              - Sid: FunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AttendanceLogs.Arn

  AttendanceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, PUT, PATCH, DELETE, POST, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: Microsoft365
        Authorizers:
          Microsoft365:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://login.microsoftonline.com/${EntraTenantId}/v2.0'
              audience:
                - !Ref EntraApiAudience
            AuthorizationScopes:
              - !Ref EntraRequiredScope

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../..
      Handler: backend/src/lambda.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt AttendanceRole.Arn
      LoggingConfig:
        LogGroup: !Ref AttendanceLogs
        LogFormat: JSON
      Environment:
        Variables:
          ATTENDANCE_TABLE: !Ref AttendanceTable
          EXPORT_BUCKET: !Ref AttendanceFiles
          TEMPLATE_KEY: !Ref TemplateKey
          TEMPLATE_MAPPING_KEY: !Ref TemplateMappingKey
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_API_AUDIENCE: !Ref EntraApiAudience
          ENTRA_REQUIRED_SCOPE: !Ref EntraRequiredScope
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        ReadDays:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/days
            Method: GET
        PutDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/days/{day}
            Method: PUT
        UpdateDayTime:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/days/{day}/time
            Method: PATCH
        DeleteDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/days/{day}
            Method: DELETE
        PutConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/config
            Method: PUT
        CreateExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/exports
            Method: POST
        GetExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /v1/exports/{id}
            Method: GET

Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${AttendanceApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}'
  TableName:
    Value: !Ref AttendanceTable
  FileBucketName:
    Value: !Ref AttendanceFiles
